services:
  postgres:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peat_guard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-peat_guard}?schema=public
      UPLOADS_DIR: /app/.data/uploads
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${WEB_PORT:-3000}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun run db:generate && bun run db:migrate:deploy && bun run db:seed && bun run dev --hostname 0.0.0.0
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [worker]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-peat_guard}?schema=public
      UPLOADS_DIR: /app/.data/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/app/.data/uploads
    depends_on:
      web:
        condition: service_healthy
    command: ["bun", "run", "worker"]
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
  next_cache:
  uploads:
