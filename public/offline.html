<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f4d3d" />
    <title>Offline · PEATGUARD</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f6f7ef;
        color: #1f4d3d;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #dce3d8;
        border-radius: 24px;
        background: white;
        text-align: center;
        box-shadow: 0 12px 40px #1f4d3d12;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 1.75rem;
      }
      p {
        margin: 0;
        color: #56645b;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 12px;
        background: #4b8a46;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #1f4d3d;
        outline-offset: 3px;
      }
      .leaf {
        display: inline-grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 50%;
        background: #e9efdc;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="leaf" aria-hidden="true">🌿</span>
      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini belum tersedia tanpa koneksi. Laporan yang sudah disimpan
        tetap aman di perangkat dan akan muncul saat Anda membuka kembali
        aplikasi.
      </p>
      <a href="/field/home">Coba buka beranda</a>
    </main>
  </body>
</html>
